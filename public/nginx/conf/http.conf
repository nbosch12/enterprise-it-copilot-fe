location /api/ {
  proxy_pass https://docupedia-grounding-api.cfapps.eu10-004.hana.ondemand.com;
  proxy_http_version 1.1;
  proxy_set_header Host docupedia-grounding-api.cfapps.eu10-004.hana.ondemand.com;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
}

